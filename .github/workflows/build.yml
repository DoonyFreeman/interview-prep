name: build-and-deploy

# Build the linux/amd64 image on every push to master and publish it to GHCR.
# The production host then pulls the prebuilt image — it never builds locally
# (the small VPS OOMs on a Vite build). Continuous deployment (the `deploy`
# job) is dormant until you opt in by setting the repo variable
# CD_ENABLED=true and the secret DEPLOY_SSH_KEY (see DEPLOY.md).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/doonyfreeman/interview-prep

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=short

      - name: Build and push (linux/amd64)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Opt-in: stays skipped until you set the CD_ENABLED repo variable to "true".
    if: ${{ github.ref == 'refs/heads/master' && vars.CD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          ASSISTANT_PROVISION: ${{ secrets.ASSISTANT_PROVISION }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ || ! "$DEPLOY_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Missing verified build revision or image digest"
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          if [[ -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          elif [[ -n "$ASSISTANT_PROVISION" ]]; then
            echo "::error::Configure the trusted SSH host key before sending assistant credentials"
            exit 1
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          deploy() {
            ssh -T -i ~/.ssh/id_deploy \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd /opt/interview-prep && ./scripts/deploy.sh $DEPLOY_REVISION $DEPLOY_IMAGE_DIGEST"
          }
          # Bring the server's forced-command script up to date before sending any credentials.
          deploy </dev/null
          if [[ -n "$ASSISTANT_PROVISION" ]]; then
            deploy_log=$(mktemp)
            trap 'rm -f "$deploy_log"' EXIT
            printf '%s\n' "$ASSISTANT_PROVISION" | deploy | tee "$deploy_log"
            if ! grep -Fxq '[deploy] assistant smoke: enabled, answered, cited lesson' "$deploy_log"; then
              echo "::error::The server did not verify an assistant reply"
              exit 1
            fi
          fi
