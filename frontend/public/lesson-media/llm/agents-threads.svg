<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">thread_id связывает снимки одного выполнения</title><desc id="desc">Checkpointer сохраняет состояние по шагам; конфигурация выбирает нужную историю. Учебный пример «Маяк», без внешних вызовов.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8590a2"/></marker></defs>
<rect width="1200" height="720" fill="#fbfaf8"/>
<text x="40" y="53" font-family="Arial, sans-serif" font-size="29" fill="#172b4d" font-weight="700">thread_id связывает снимки одного выполнения</text>
<text x="40" y="89" font-family="Arial, sans-serif" font-size="20" fill="#52647d" font-weight="400">Checkpointer сохраняет состояние по шагам; конфигурация выбирает нужную историю</text>
<text x="40" y="697" font-family="Arial, sans-serif" font-size="18" fill="#52647d" font-weight="400">МАЯК · учебный пример · без внешних вызовов</text>
<rect x="40" y="150" width="1120" height="146" rx="14" fill="#e9f2ff" stroke="#0c66e4" stroke-width="2"/>
<text x="60" y="184" font-family="Arial, sans-serif" font-size="24" fill="#0c66e4" font-weight="700">thread_id = &quot;return-42&quot;</text>
<rect x="70" y="210" width="320" height="63" rx="14" fill="#ffffff" stroke="#c7d1db" stroke-width="2"/>
<text x="85" y="250" font-family="Arial, sans-serif" font-size="22" fill="#172b4d" font-weight="400">s₀ · вопрос</text>
<path d="M395 242 L430 242" stroke="#8590a2" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="440" y="210" width="320" height="63" rx="14" fill="#ffffff" stroke="#c7d1db" stroke-width="2"/>
<text x="455" y="250" font-family="Arial, sans-serif" font-size="22" fill="#172b4d" font-weight="400">s₁ · заказ загружен</text>
<path d="M765 242 L800 242" stroke="#8590a2" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="810" y="210" width="320" height="63" rx="14" fill="#ffffff" stroke="#c7d1db" stroke-width="2"/>
<text x="825" y="250" font-family="Arial, sans-serif" font-size="22" fill="#172b4d" font-weight="400">s₂ · ответ</text>
<rect x="40" y="330" width="1120" height="146" rx="14" fill="#e6f6ee" stroke="#16825d" stroke-width="2"/>
<text x="60" y="364" font-family="Arial, sans-serif" font-size="24" fill="#16825d" font-weight="700">thread_id = &quot;return-77&quot;</text>
<rect x="70" y="390" width="320" height="63" rx="14" fill="#ffffff" stroke="#c7d1db" stroke-width="2"/>
<text x="85" y="430" font-family="Arial, sans-serif" font-size="22" fill="#172b4d" font-weight="400">s₀ · другой вопрос</text>
<path d="M395 422 L430 422" stroke="#8590a2" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="440" y="390" width="320" height="63" rx="14" fill="#ffffff" stroke="#c7d1db" stroke-width="2"/>
<text x="455" y="430" font-family="Arial, sans-serif" font-size="22" fill="#172b4d" font-weight="400">s₁ · другие данные</text>
<path d="M765 422 L800 422" stroke="#8590a2" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="810" y="390" width="320" height="63" rx="14" fill="#ffffff" stroke="#c7d1db" stroke-width="2"/>
<text x="825" y="430" font-family="Arial, sans-serif" font-size="22" fill="#172b4d" font-weight="400">s₂ · свой ответ</text>
<rect x="40" y="520" width="545" height="118" rx="14" fill="#fff3eb" stroke="#b65b13" stroke-width="2"/>
<text x="58" y="555" font-family="Arial, sans-serif" font-size="24" fill="#b65b13" font-weight="700">RAM saver</text>
<text x="58" y="587" font-family="Arial, sans-serif" font-size="21" fill="#52647d" font-weight="400">Удобен локально; перезапуск процесса</text>
<text x="58" y="617" font-family="Arial, sans-serif" font-size="21" fill="#52647d" font-weight="400">теряет историю в оперативной памяти.</text>
<rect x="615" y="520" width="545" height="118" rx="14" fill="#ffffff" stroke="#0c66e4" stroke-width="2"/>
<text x="633" y="555" font-family="Arial, sans-serif" font-size="24" fill="#0c66e4" font-weight="700">SQLite / Postgres saver</text>
<text x="633" y="587" font-family="Arial, sans-serif" font-size="21" fill="#52647d" font-weight="400">Снимки хранятся в базе; срок жизни</text>
<text x="633" y="617" font-family="Arial, sans-serif" font-size="21" fill="#52647d" font-weight="400">зависит от хранения и очистки.</text>
<text x="40" y="673" font-family="Arial, sans-serif" font-size="23" fill="#172b4d" font-weight="700">thread_id — строковый ключ, не поток ОС и не проверка прав доступа.</text>
</svg>
